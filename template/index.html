<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>도름이 아이템 미리보기</title>
    <style>
      :root { --paper: #f2ede4; --snow: #fbf8f1; --ink: #1d2433; --navy: #041642; --line: #d9d1c3; --ok: #1f6b3a; --bad: #a2322a; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; word-break: keep-all; overflow-wrap: anywhere; }
      body { display: grid; grid-template-rows: auto 1fr auto; }
      header { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
      h1 { margin: 0; font-size: 17px; }
      #stage { width: 100%; height: 100%; display: block; min-height: 320px; touch-action: none; }
      #tools { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
      .group { display: flex; gap: 6px; flex-wrap: wrap; }
      button { font: inherit; font-size: 14px; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--snow); color: var(--ink); cursor: pointer; }
      button[aria-pressed="true"] { background: var(--navy); color: var(--snow); border-color: var(--navy); }
      button#save { background: var(--navy); color: var(--snow); border-color: var(--navy); font-weight: 600; }
      button:disabled { opacity: 0.6; cursor: wait; }
      #status { margin: 0; padding: 10px 16px 14px; font-size: 14px; line-height: 1.5; }
      #status[data-kind="ok"] { color: var(--ok); }
      #status[data-kind="error"] { color: var(--bad); font-weight: 600; }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">도름이 아이템 미리보기</h1>
      <div id="tools" hidden>
        <div class="group" id="views" aria-label="보는 방향"></div>
        <div class="group" id="clips" aria-label="동작"></div>
        <button id="save" type="button">저장</button>
      </div>
    </header>
    <canvas id="stage"></canvas>
    <p id="status" role="status"></p>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
